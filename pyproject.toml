[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spl-tls-analyze"
version = "0.3.3b0"
description = "Fast, zero-dependency TLS risk analysis with OCSP revocation detection and structured decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
keywords = ["tls", "ssl", "security", "certificate",
            "ocsp", "risk-analysis", "cli", "devops",
            "devsecops", "network-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Jonah15-sudo/trustlint-cli"
Repository = "https://github.com/Jonah15-sudo/trustlint-cli"
Issues = "https://github.com/Jonah15-sudo/trustlint-cli/issues"
Documentation = "https://github.com/Jonah15-sudo/trustlint-cli#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ca-store = ["certifi>=2024.0.0"]

[project.scripts]
spl-tls-analyze = "scripts.spl_tls_analyze:main"

[tool.setuptools]
packages = [
  "decision_orchestrator",
  "scripts",
  "tls_policy_adapter",
  "weakness_mapper",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
